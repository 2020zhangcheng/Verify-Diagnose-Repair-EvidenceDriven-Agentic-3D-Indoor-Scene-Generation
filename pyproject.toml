[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "roomscout"
version = "1.0.0"
description = "RoomScout Geometry Critic with explicit ReAct repair"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7,<3", "pydantic-settings>=2,<3", "fastapi>=0.115,<1",
  "httpx>=0.27,<1", "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

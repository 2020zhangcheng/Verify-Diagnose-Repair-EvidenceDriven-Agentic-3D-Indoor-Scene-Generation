[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "roomscout"
version = "0.2.0"
description = "RoomScout V0 durable fake agent loop"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7,<3", "pydantic-settings>=2,<3", "fastapi>=0.115,<1",
  "httpx>=0.27,<1", "uvicorn>=0.30,<1", "langgraph>=1,<2", "langgraph-checkpoint-postgres>=3,<4",
  "psycopg[binary,pool]>=3.2,<4", "SQLAlchemy>=2,<3", "alembic>=1.13,<2",
  "pgvector>=0.3,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1"]
memory = ["mem0ai"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = ["integration: requires migrated PostgreSQL"]

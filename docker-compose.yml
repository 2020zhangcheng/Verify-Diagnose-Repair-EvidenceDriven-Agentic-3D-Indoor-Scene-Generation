services:
  api:
    build: .
    environment:
      DEMO_TOKEN: ${DEMO_TOKEN:-roomscout-local-demo}
      ROOMSCOUT_LLM_BASE_URL: ${ROOMSCOUT_LLM_BASE_URL:-}
      ROOMSCOUT_LLM_API_KEY: ${ROOMSCOUT_LLM_API_KEY:-}
      ROOMSCOUT_LLM_MODEL: ${ROOMSCOUT_LLM_MODEL:-}
      ROOMSCOUT_LLM_TIMEOUT_SECONDS: ${ROOMSCOUT_LLM_TIMEOUT_SECONDS:-60}
      ROOMSCOUT_LLM_MAX_TOKENS: ${ROOMSCOUT_LLM_MAX_TOKENS:-1500}
      ROOMSCOUT_LLM_TOKEN_PARAMETER: ${ROOMSCOUT_LLM_TOKEN_PARAMETER:-max_tokens}
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 20
